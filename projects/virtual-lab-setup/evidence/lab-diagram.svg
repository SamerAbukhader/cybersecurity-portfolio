<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" font-family="Segoe UI, Arial, sans-serif" font-size="14">
  <rect width="760" height="380" fill="#ffffff"/>
  <!-- Host boundary -->
  <rect x="20" y="20" width="560" height="340" rx="10" fill="#f4f6f8" stroke="#8a95a1" stroke-dasharray="6 4"/>
  <text x="36" y="44" font-weight="600" fill="#333">Windows host PC: VirtualBox 7.2.22</text>
  <!-- Switch -->
  <rect x="190" y="160" width="220" height="60" rx="8" fill="#e3edf7" stroke="#3d6fa3" stroke-width="1.5"/>
  <text x="300" y="185" text-anchor="middle" font-weight="600" fill="#1f3f63">Host-only network</text>
  <text x="300" y="205" text-anchor="middle" fill="#1f3f63">192.168.56.0/24 (host: .1)</text>
  <!-- Kali -->
  <rect x="50" y="270" width="200" height="70" rx="8" fill="#ffffff" stroke="#333"/>
  <text x="150" y="295" text-anchor="middle" font-weight="600">Kali Linux (attacker)</text>
  <text x="150" y="315" text-anchor="middle">192.168.56.102</text>
  <text x="150" y="332" text-anchor="middle" font-size="12" fill="#555">2 CPU · 2 GB RAM</text>
  <!-- Metasploitable -->
  <rect x="350" y="270" width="200" height="70" rx="8" fill="#ffffff" stroke="#333"/>
  <text x="450" y="295" text-anchor="middle" font-weight="600">Metasploitable 2 (target)</text>
  <text x="450" y="315" text-anchor="middle">192.168.56.101</text>
  <text x="450" y="332" text-anchor="middle" font-size="12" fill="#555">1 CPU · 2 GB RAM</text>
  <!-- Links -->
  <line x1="150" y1="270" x2="250" y2="220" stroke="#3d6fa3" stroke-width="2"/>
  <line x1="450" y1="270" x2="350" y2="220" stroke="#3d6fa3" stroke-width="2"/>
  <!-- Internet -->
  <ellipse cx="670" cy="110" rx="70" ry="40" fill="#fdecea" stroke="#b3261e"/>
  <text x="670" y="105" text-anchor="middle" font-weight="600" fill="#b3261e">Internet /</text>
  <text x="670" y="123" text-anchor="middle" font-weight="600" fill="#b3261e">home LAN</text>
  <line x1="410" y1="180" x2="600" y2="115" stroke="#b3261e" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="490" y1="132" x2="520" y2="162" stroke="#b3261e" stroke-width="4"/>
  <line x1="520" y1="132" x2="490" y2="162" stroke="#b3261e" stroke-width="4"/>
  <text x="505" y="190" text-anchor="middle" font-size="12" fill="#b3261e">no NAT / no bridge</text>
</svg>
